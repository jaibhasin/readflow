<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readflow · Reads</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #141b1e;
        color: #edf0ed;
        --accent: #d6e986;
        --muted: #a5b2ad;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html { scrollbar-width: thin; scrollbar-color: #66746d #1c2428; }
      body { margin: 0; min-width: 360px; }
      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 28px;
        border: 1px solid #59676b;
        border-bottom-color: #111719;
        border-radius: 20px;
        background: linear-gradient(145deg, #3e4a4e, #283135 24%, #1c2428 72%);
        box-shadow: 0 18px 44px rgb(0 0 0 / 25%), inset 0 1px rgb(255 255 255 / 12%);
      }
      header, .actions, nav, .brand { display: flex; align-items: center; }
      header { justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .brand { gap: 10px; font: 800 11px/1 var(--mono); letter-spacing: .19em; }
      .power { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 9px rgb(214 233 134 / 35%); }
      .edition { color: #9eaca6; font: 10px/1 var(--mono); letter-spacing: .12em; margin-left: 3px; border-left: 1px solid #65716e; padding-left: 12px; }
      h1 { font-size: 28px; font-weight: 650; letter-spacing: -.045em; line-height: 1.2; margin: 0; }
      .intro { color: #b6c1bb; max-width: 44ch; margin: 9px 0 20px; }
      button {
        appearance: none;
        font: 600 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        border: 1px solid #626c70;
        border-bottom-color: #172023;
        border-radius: 6px 6px 9px 9px;
        padding: 9px 12px;
        min-height: 36px;
        background: linear-gradient(180deg, #485055, #30383d);
        box-shadow: inset 0 1px rgb(255 255 255 / 12%), 0 2px 3px rgb(0 0 0 / 20%);
        color: inherit;
        transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
      }
      button:hover { background: linear-gradient(180deg, #596267, #3b454a); border-color: #83908c; }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      button:disabled { opacity: .5; cursor: default; }
      #debug { color: #b9c4c3; background: transparent; border: 0; box-shadow: none; padding: 4px 0 4px 8px; min-height: 24px; font-size: 11px; }
      #debug:hover { color: #eff5ef; }
      nav { gap: 8px; margin-bottom: 6px; }
      nav button { flex: 1; }
      #save::before { content: "+"; font: 16px/1 var(--mono); margin-right: 7px; color: var(--accent); }
      #expand { background: #232d30; box-shadow: none; border-color: #52605f; color: #c7d2ca; }
      #expand:hover { background: #354144; }
      #notice { color: var(--accent); margin: 12px 0 0; font-size: 12px; }
      #notice:empty { display: none; }
      section { margin-top: 26px; }
      .section-caption { display: block; color: #8f9f96; font: 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 7px; }
      h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 12px; }
      .count { font: 10px/1 var(--mono); color: #b6c5a1; background: #323d35; border: 1px solid #526149; border-radius: 5px; padding: 4px 6px; }
      .read-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      article { position: relative; display: flex; flex-direction: column; min-width: 0; border: 1px solid #101719; border-radius: 10px; overflow: hidden; background: #20292c; box-shadow: 0 3px 9px rgb(0 0 0 / 18%), 0 0 0 1px rgb(136 150 141 / 18%); }
      .tape-label { background: linear-gradient(180deg, #eee8d6, #d9d1ba); border-bottom: 3px solid #a4ad78; color: #30382f; padding: 13px 15px 14px; }
      .tape-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .tape-mark { flex: none; border: 1px solid #91977d; border-radius: 3px; padding: 2px 4px; font: 700 8px/1 var(--mono); letter-spacing: .06em; }
      .site { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #59624d; font: 9px/1.4 var(--mono); }
      h3 { font-size: 15px; font-weight: 650; letter-spacing: -.02em; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
      .read-link { color: inherit; text-decoration: none; }
      .read-link::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 10px; }
      .read-link:focus-visible { outline: none; }
      .read-link:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
      article:hover { box-shadow: 0 4px 14px rgb(0 0 0 / 24%), 0 0 0 1px #91a17e; }
      article:hover .read-link { text-decoration: underline; text-decoration-color: #91977d; text-underline-offset: 3px; }
      .read-body { display: flex; flex: 1; flex-direction: column; padding: 12px 15px 14px; }
      .status { margin: 0; color: #aebdb2; font-size: 11px; line-height: 1.8; }
      .status-lead { display: block; color: #dce9ac; font: 700 12px/1.5 var(--mono); margin-bottom: 2px; }
      .status-lead::before { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; margin-right: 7px; vertical-align: 2px; }
      article[data-status="queued"] .status-lead { color: #c1cbc3; }
      article[data-status="queued"] .status-lead::before { background: transparent; border: 1px solid #a6b39b; }
      progress { appearance: none; width: 100%; height: 5px; display: block; margin: 12px 0 3px; border: 0; border-radius: 3px; overflow: hidden; background: #12191c; accent-color: var(--accent); }
      progress::-webkit-progress-bar { background: #12191c; border-radius: 3px; box-shadow: inset 0 1px 2px rgb(0 0 0 / 45%); }
      progress::-webkit-progress-value { background: linear-gradient(90deg, #9ba96a, #d6e986); border-radius: 3px; }
      progress::-moz-progress-bar { background: var(--accent); border-radius: 3px; }
      .actions { position: relative; z-index: 2; gap: 8px; margin-top: auto; padding-top: 13px; }
      .play { color: #e4edc0; border-color: #69745d; background: linear-gradient(180deg, #414d3c, #2c382e); }
      .play::before { content: ""; display: inline-block; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid var(--accent); margin-right: 7px; }
      .play:hover { background: linear-gradient(180deg, #54624b, #37463a); border-color: #9da97d; }
      .remove { margin-left: auto; padding: 5px 0 5px 8px; min-height: 30px; color: #97a8a0; background: transparent; border: 0; box-shadow: none; font-size: 10px; }
      .remove:hover { background: transparent; color: #ebc4b8; }
      .empty { grid-column: 1 / -1; margin: 0; padding: 19px 18px; border: 1px dashed #53615d; border-radius: 9px; background: rgb(18 25 28 / 25%); }
      .empty p { max-width: 48ch; color: #a5b2ad; font-size: 12px; line-height: 1.7; margin: 0; }
      #completed { border-top: 1px solid #46534f; padding-top: 17px; margin-top: 24px; }
      summary { cursor: pointer; color: #acbbb0; font: 11px/1.5 var(--mono); padding: 3px 0; }
      #done { margin-top: 13px; }
      footer { display: flex; align-items: start; gap: 9px; margin-top: 22px; color: #8c9d95; }
      footer svg { flex: none; margin-top: 2px; }
      footer p { margin: 0; font-size: 10px; line-height: 1.7; max-width: 62ch; }
      @media (min-width: 601px) { body[data-view="page"] .tape-label { min-height: 94px; } }
      @media (max-width: 600px) {
        body { min-width: 360px; }
        main { margin: 0; border: 0; border-radius: 0; padding: 22px; }
        .read-grid { grid-template-columns: minmax(0, 1fr); }
        h1 { font-size: 26px; }
        .edition { display: none; }
      }
      body[data-view="page"] { min-width: 0; }
      body[data-view="popup"] { width: 400px; max-width: 100%; }
      body[data-view="popup"] main { margin: 0; border: 0; border-radius: 0; padding: 22px; }
      body[data-view="popup"] .read-grid { grid-template-columns: minmax(0, 1fr); }
      body[data-view="popup"] .edition { display: none; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-view="popup">
    <main>
      <header><div class="brand"><span class="power" aria-hidden="true"></span>READFLOW<span class="edition">READING SHELF</span></div><button id="debug" type="button">Debug</button></header>
      <h1>Your reads</h1>
      <p class="intro">Pick up where you left off.<br />Keep something good for later.</p>
      <nav aria-label="Reading list actions"><button id="save" type="button">Save current article</button><button id="expand" type="button">Open full list</button></nav>
      <p id="notice" role="status" aria-live="polite"></p>
      <section aria-labelledby="pending-title"><span class="section-caption">Side A · Pick up where you left off</span><h2 id="pending-title">In progress</h2><div id="pending" class="read-grid"></div></section>
      <section aria-labelledby="future-title"><span class="section-caption">Side B · Next in line</span><h2 id="future-title">To read</h2><div id="future" class="read-grid"></div></section>
      <details id="completed"><summary>Completed reads</summary><div id="done" class="read-grid"></div></details>
      <footer><svg width="13" height="15" viewBox="0 0 13 15" fill="none" aria-hidden="true"><rect x="1.5" y="6" width="10" height="8" rx="2" stroke="currentColor"/><path d="M3.5 6V4a3 3 0 0 1 6 0v2" stroke="currentColor"/></svg><p>Saved in this browser. Time estimates use 180 words per minute. Removing a read deletes its saved text.</p></footer>
    </main>
    <script type="module" src="./reading-list.ts"></script>
  </body>
</html>
